[build]
  command = "npm run build"
  publish = "dist"

[[edge_functions]]
  path = "/api/transcribe"
  function = "transcribe"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/ffmpeg-core/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
